<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Teclingo - Curso Completo de Inglés Profesional</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    font-family: "Inter", "Segoe UI", -apple-system, sans-serif;
    background: #05070d;
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .cover {
    position: relative;
    width: min(430px, 100vw);
    aspect-ratio: 9 / 16;
    max-height: 100vh;
    background: linear-gradient(170deg, #0a1226 0%, #0a1020 55%, #060a14 100%);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 34px 26px 22px;
    text-align: center;
    box-shadow: 0 30px 90px rgba(0, 0, 0, 0.6);
  }

  .cover::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background-image:
      radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,.5), transparent 50%),
      radial-gradient(1px 1px at 30% 65%, rgba(255,255,255,.28), transparent 50%),
      radial-gradient(1.5px 1.5px at 55% 15%, rgba(255,255,255,.4), transparent 50%),
      radial-gradient(1px 1px at 70% 45%, rgba(255,255,255,.22), transparent 50%),
      radial-gradient(1px 1px at 85% 75%, rgba(255,255,255,.35), transparent 50%),
      radial-gradient(1.5px 1.5px at 20% 90%, rgba(255,255,255,.25), transparent 50%),
      radial-gradient(1px 1px at 45% 50%, rgba(255,255,255,.18), transparent 50%),
      radial-gradient(1px 1px at 92% 12%, rgba(255,255,255,.3), transparent 50%);
    background-size: 340px 340px;
    animation: starDrift 160s linear infinite;
    opacity: 0.8;
  }

  @keyframes starDrift {
    from { background-position: 0 0; }
    to { background-position: -680px 340px; }
  }

  .cover-orb {
    position: absolute;
    left: 50%;
    top: 36%;
    width: 300px;
    height: 300px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: conic-gradient(
      from 0deg,
      #06263f, #0a4d7a, #0e6fb0, #063a5e,
      #0a5c94, #04202f, #0d7cc4, #07476f,
      #0a4d7a, #06263f, #0e6fb0, #04202f,
      #0d7cc4, #07476f, #0a5c94, #06263f
    );
    filter: blur(2px) saturate(1.2);
    opacity: 0.32;
    animation: coverSpin 30s linear infinite;
  }

  @keyframes coverSpin {
    to { transform: translate(-50%, -50%) rotate(360deg); }
  }

  .logo {
    position: relative;
    z-index: 1;
    font-size: 24px;
    font-weight: 800;
    letter-spacing: 0.18em;
    color: #dfe8ff;
    text-shadow: 0 0 24px rgba(120, 170, 255, 0.35);
  }

  .brand {
    position: relative;
    z-index: 1;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.3em;
    color: rgba(255, 255, 255, 0.85);
    margin-top: 4px;
  }

  .brand-sub {
    position: relative;
    z-index: 1;
    font-size: 12px;
    font-style: italic;
    color: #7ef0a6;
    margin-top: 2px;
  }

  .title {
    position: relative;
    z-index: 1;
    font-size: 23px;
    font-weight: 800;
    line-height: 1.25;
    margin-top: 30px;
    letter-spacing: 0.02em;
  }

  .subtitle {
    position: relative;
    z-index: 1;
    font-size: 11.5px;
    color: rgba(255, 255, 255, 0.55);
    margin-top: 12px;
    line-height: 1.7;
  }

  .badges {
    position: relative;
    z-index: 1;
    display: flex;
    gap: 10px;
    margin-top: 24px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .badge-seal {
    border: 1px solid rgba(255, 215, 120, 0.35);
    color: rgba(255, 230, 160, 0.9);
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 9.5px;
    letter-spacing: 0.12em;
    background: rgba(255, 215, 120, 0.04);
  }

  .badge-seal.blue {
    border-color: rgba(74, 158, 255, 0.4);
    color: rgba(150, 200, 255, 0.9);
    background: rgba(74, 158, 255, 0.05);
  }

  .skills {
    position: relative;
    z-index: 1;
    display: flex;
    gap: 16px;
    margin-top: 28px;
    font-size: 17px;
    opacity: 0.75;
  }

  .footer {
    position: relative;
    z-index: 1;
    margin-top: auto;
    padding-top: 16px;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    width: 100%;
    font-size: 9.5px;
    letter-spacing: 0.08em;
    color: rgba(255, 255, 255, 0.55);
    line-height: 1.8;
  }
</style>
</head>
<body>
  <div class="cover">
    <div class="cover-orb"></div>

    <div class="logo">TC</div>
    <div class="brand">TECLINGO</div>
    <div class="brand-sub">Inglés.com</div>

    <h1 class="title">CURSO COMPLETO DE<br>INGLÉS PROFESIONAL</h1>

    <p class="subtitle">
      Consolidación de habilidades y preparación estratégica<br>
      Alineado al MCER · Nivel competente B2 · Enfoque TOEFL iBT
    </p>

    <div class="badges">
      <span class="badge-seal blue">ALINEADO AL MCER · B2</span>
      <span class="badge-seal">TOEFL iBT READY</span>
    </div>

    <div class="skills">
      <span>🎧</span><span>📖</span><span>🎤</span><span>✍️</span>
    </div>

    <div class="footer">
      CONCEPTO AI MX - PANUCO VER. 2026 - 2027<br>
      TEL: +52 833 289 2730
    </div>
  </div>
</body>
</html>
